
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       8086; # Порт, на котором будет доступен ваш сайт
        server_name  localhost;

        # 1. Обслуживание статического фронтенда (Vue)
        location / {
            # ВАЖНО: В Windows используйте прямые слеши (/) или двойные обратные (\\)
            root   dist/;
            index  index.html;
            
            # Эта строка критически важна для Vue Router (SPA). 
            # Если файл не найден, она отдает index.html, чтобы роутинг отработал на стороне JS.
            try_files $uri $uri/ /index.html;
        }

        # 2. Проксирование запросов к бэкенду
        # Ловим все запросы, начинающиеся с /mail/
        location /strangeData/ {
            # Передаем запрос на бэкенд. 
            # Отсутствие слеша в конце означает, что путь /mail/Send передастся как /mail/Send
            proxy_pass http://localhost:8007;
            
            # Стандартные заголовки для корректной работы бэкенда
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Если бэкенд долго думает, увеличиваем таймауты (опционально)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
		
		location /mail/ {
            # Передаем запрос на бэкенд. 
            # Отсутствие слеша в конце означает, что путь /mail/Send передастся как /mail/Send
            proxy_pass http://localhost:8007;
            
            # Стандартные заголовки для корректной работы бэкенда
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Если бэкенд долго думает, увеличиваем таймауты (опционально)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }


